Outputs:
  AlertsTopicArn:
    Description: "SNS topic all CloudWatch alarms publish to. Check your email (the\
      \ AlertEmail parameter value) for a subscription-confirmation link after first\
      \ deploy \u2014 alarms won't actually notify you until that's confirmed.\n"
    Value:
      Ref: AlertsTopic
  ApiEndpoint:
    Description: Base URL for CrowdShield HTTP API
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  WebSocketUrl:
    Description: 'WebSocket URL for real-time push. Connect with wss://.../{stage}?token=<Cognito
      ID token>&venueId=<venue id>

      '
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  HealthUrl:
    Description: "Phase 1 health check \u2014 open in browser, expect 200"
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/health
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: CrowdShieldUserPool
  UserPoolClientId:
    Description: Cognito App Client ID (iOS)
    Value:
      Ref: CrowdShieldUserPoolClient
  UserPoolArn:
    Description: Cognito User Pool ARN (for API JWT authorizer in Phase 2)
    Value:
      Fn::GetAtt:
      - CrowdShieldUserPool
      - Arn
  VenueStateTableName:
    Value:
      Ref: VenueStateTable
  AlertsTableName:
    Value:
      Ref: AlertsTable
  IncidentsTableName:
    Value:
      Ref: IncidentsTable
  RecommendationsTableName:
    Value:
      Ref: RecommendationsTable
  VenueStateUrlTemplate:
    Description: PUT/GET this with a real venueId in place of {venueId}
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/state
  AlertsUrlTemplate:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/alerts
  IncidentsUrlTemplate:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/incidents
  RecommendationsUrlTemplate:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/recommendations
  VenuesUrl:
    Description: GET to list venues, POST (Command only) to create one
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues
  SummaryUrlTemplate:
    Description: POST to generate a fresh AI incident summary for a venue
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/summary
  Region:
    Value:
      Ref: AWS::Region
