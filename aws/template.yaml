# -----------------------------------------------------------------------------
# Outputs — copy these into the iOS app / Amplify config later
# -----------------------------------------------------------------------------
Outputs:
  AlertsTopicArn:
    Description: >
      SNS topic all CloudWatch alarms publish to. Check your email (the
      AlertEmail parameter value) for a subscription-confirmation link
      after first deploy — alarms won't actually notify you until that's
      confirmed.
    Value: !Ref AlertsTopic

  ApiEndpoint:
    Description: Base URL for CrowdShield HTTP API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'

  WebSocketUrl:
    Description: >
      WebSocket URL for real-time push. Connect with
      wss://.../{stage}?token=<Cognito ID token>&venueId=<venue id>
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'

  HealthUrl:
    Description: Phase 1 health check — open in browser, expect 200
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/health'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CrowdShieldUserPool

  UserPoolClientId:
    Description: Cognito App Client ID (iOS)
    Value: !Ref CrowdShieldUserPoolClient

  UserPoolArn:
    Description: Cognito User Pool ARN (for API JWT authorizer in Phase 2)
    Value: !GetAtt CrowdShieldUserPool.Arn

  VenueStateTableName:
    Value: !Ref VenueStateTable
  AlertsTableName:
    Value: !Ref AlertsTable
  IncidentsTableName:
    Value: !Ref IncidentsTable
  RecommendationsTableName:
    Value: !Ref RecommendationsTable

  VenueStateUrlTemplate:
    Description: PUT/GET this with a real venueId in place of {venueId}
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/state'

  AlertsUrlTemplate:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/alerts'

  IncidentsUrlTemplate:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/incidents'

  RecommendationsUrlTemplate:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/recommendations'

  VenuesUrl:
    Description: GET to list venues, POST (Command only) to create one
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues'

  SummaryUrlTemplate:
    Description: POST to generate a fresh AI incident summary for a venue
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/venues/{venueId}/summary'

  Region:
    Value: !Ref AWS::Region
